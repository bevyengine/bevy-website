# The URL the site will be built for
base_url = "https://bevy.org"

# Used for the Atom feed
title = "Bevy Engine"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# When set to "true", the generated HTML files are minified.
minify_html = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

generate_feeds = true
feed_limit = 1000

taxonomies = [{ name = "news", feed = true }]

[markdown.highlighting]
# Emit inline colours rather than CSS classes. Combined with the light/dark
# theme pair below, Zola emits `light-dark()` colours, so a single build serves
# both colour schemes. See `sass/components/_syntax-theme.scss` for how this is
# wired up to the site's dark-by-default / light-on-docs behaviour.
style = "inline"
light_theme = "one-light"
dark_theme = "one-dark-pro"

# Treat an unrecognised code fence language as a build error, so typos and
# unsupported languages are caught in CI rather than silently rendering unstyled.
error_on_missing_language = true

# Load extra grammars for languages Zola doesn't bundle.
extra_grammars = ["grammars/ron.json"]

[extra]
# Put all your custom variables here
